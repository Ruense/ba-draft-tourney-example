<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="sh_logo_norm_white.png">
  <title>BO3 Draft Spectator Overlay - Senseihood</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;900&display=swap');
    * { font-family: 'Noto Sans', sans-serif !important; }
    body { background-color: #0f172a; color: #f8fafc; }
    .schale-dark { background: #1e293b; border: 1px solid #334155; }
    .schale-inner { background: #0f172a; border: 1px solid #1e293b; }
  </style>
</head>
<body class="p-6 min-h-screen flex flex-col justify-between">

  <!-- SPECTATOR TOP HEADER BAR -->
  <header class="schale-dark rounded-2xl p-4 mb-6 flex justify-between items-center shadow-2xl border-sky-500/30">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 rounded-xl bg-sky-500 p-1 flex items-center justify-center">
        <img src="sh_logo_norm_white.png" class="w-full h-full object-contain">
      </div>
      <div>
        <h1 class="text-xl font-black tracking-widest text-white uppercase flex items-center gap-2">
          SENSEIHOOD <span class="text-sky-400">BO3 SPECTATOR VIEW</span>
        </h1>
        <p class="text-xs text-sky-400 font-bold" id="match-pair-title">WAITING FOR ROOM SYNC...</p>
      </div>
    </div>

    <!-- ROOM CODE INPUT -->
    <div class="flex items-center gap-2 bg-slate-900 px-3 py-1.5 rounded-xl border border-slate-700">
      <span class="text-xs font-bold text-slate-400">ROOM:</span>
      <input type="text" id="room-input" value="default-room" class="bg-slate-800 text-sky-400 font-black text-xs px-2 py-1 rounded w-28 text-center outline-none">
      <button onclick="syncRoom()" class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-black text-xs px-3 py-1 rounded transition">SYNC</button>
    </div>
  </header>

  <!-- TOP BANS SUMMARY -->
  <div class="grid grid-cols-2 gap-6 mb-6">
    <!-- HOST BANS -->
    <div class="schale-dark rounded-2xl p-4 border-l-4 border-sky-500">
      <h2 class="text-xs font-black text-sky-400 uppercase mb-3" id="spec-host-header">Host Boss Bans (4)</h2>
      <div id="spec-host-bans" class="flex gap-3"></div>
    </div>
    <!-- GUEST BANS -->
    <div class="schale-dark rounded-2xl p-4 border-r-4 border-rose-500 text-right">
      <h2 class="text-xs font-black text-rose-400 uppercase mb-3" id="spec-guest-header">Guest Boss Bans (4)</h2>
      <div id="spec-guest-bans" class="flex gap-3 justify-end"></div>
    </div>
  </div>

  <!-- 3 GAME CARDS DISPLAY -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 flex-1">
    <!-- G1 -->
    <div class="schale-dark rounded-2xl p-4 flex flex-col justify-between">
      <div>
        <div class="text-xs font-black text-sky-400 mb-3 pb-1 border-b border-slate-700" id="spec-g1-title">GAME 1 (HOST PICK)</div>
        <div id="spec-g1-boss" class="schale-inner rounded-xl p-3 mb-3 text-center min-h-[100px] flex items-center justify-center"></div>
        <div id="spec-g1-terrain" class="schale-inner rounded-xl p-3 mb-3 text-center min-h-[60px] flex items-center justify-center"></div>
      </div>
      <div>
        <div class="text-xs font-bold text-slate-400 mb-2">Guest Student Bans:</div>
        <div id="spec-g1-student-bans" class="grid grid-cols-3 gap-2"></div>
      </div>
    </div>

    <!-- G2 -->
    <div class="schale-dark rounded-2xl p-4 flex flex-col justify-between">
      <div>
        <div class="text-xs font-black text-rose-400 mb-3 pb-1 border-b border-slate-700" id="spec-g2-title">GAME 2 (GUEST PICK)</div>
        <div id="spec-g2-boss" class="schale-inner rounded-xl p-3 mb-3 text-center min-h-[100px] flex items-center justify-center"></div>
        <div id="spec-g2-terrain" class="schale-inner rounded-xl p-3 mb-3 text-center min-h-[60px] flex items-center justify-center"></div>
      </div>
      <div>
        <div class="text-xs font-bold text-slate-400 mb-2">Host Student Bans:</div>
        <div id="spec-g2-student-bans" class="grid grid-cols-3 gap-2"></div>
      </div>
    </div>

    <!-- G3 DECIDER -->
    <div class="schale-dark rounded-2xl p-4 flex flex-col justify-between border-2 border-amber-500/50">
      <div>
        <div class="text-xs font-black text-amber-400 mb-3 pb-1 border-b border-slate-700">GAME 3 (DECIDER)</div>
        <div id="spec-g3-boss" class="schale-inner rounded-xl p-3 mb-3 text-center min-h-[100px] flex items-center justify-center"></div>
        <div id="spec-g3-terrain" class="schale-inner rounded-xl p-3 mb-3 text-center min-h-[60px] flex items-center justify-center"></div>
      </div>
      <div>
        <div class="text-xs font-bold text-slate-400 mb-2">Decider Student Bans (4):</div>
        <div id="spec-g3-student-bans" class="grid grid-cols-4 gap-2"></div>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCCThwp_3-lx7C6MyCWiUiZich_guk4oLk",
      authDomain: "bluearchivedrafttourney.firebaseapp.com",
      databaseURL: "https://bluearchivedrafttourney-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "bluearchivedrafttourney",
      storageBucket: "bluearchivedrafttourney.firebasestorage.app",
      messagingSenderId: "615654907851",
      appId: "1:1:615654907851:web:f2d3b7101e07149faae04e"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let currentRoomRef = null;

    function syncRoom() {
      const code = document.getElementById('room-input').value.trim() || 'default-room';
      if (currentRoomRef) currentRoomRef.off();

      currentRoomRef = db.ref('draft_rooms/' + code);
      currentRoomRef.on('value', snapshot => {
        const data = snapshot.val();
        if (data) renderSpectator(data);
      });
    }

    function renderSpectator(data) {
      const hostName = data.hostName || 'Host';
      const guestName = data.guestName || 'Guest';

      document.getElementById('match-pair-title').innerText = `${hostName.toUpperCase()} VS ${guestName.toUpperCase()}`;
      document.getElementById('spec-host-header').innerText = `${hostName} Boss Bans (4)`;
      document.getElementById('spec-guest-header').innerText = `${guestName} Boss Bans (4)`;

      document.getElementById('spec-g1-title').innerText = `GAME 1 (${hostName.toUpperCase()} PICK)`;
      document.getElementById('spec-g2-title').innerText = `GAME 2 (${guestName.toUpperCase()} PICK)`;

      // Render Top Boss Bans
      const bannedBosses = data.bannedBosses || [];
      const hostBans = bannedBosses.filter(b => b.team === 'blue');
      const guestBans = bannedBosses.filter(b => b.team === 'red');

      let hostBansHTML = '';
      for (let i = 0; i < 4; i++) {
        const b = hostBans[i];
        if (b) {
          hostBansHTML += `<div class="w-16 h-16 bg-slate-800 rounded-lg border border-sky-400 overflow-hidden relative"><img src="${b.image || ''}" class="w-full h-full object-cover grayscale opacity-75"></div>`;
        } else {
          hostBansHTML += `<div class="w-16 h-16 schale-inner rounded-lg flex items-center justify-center text-xs font-bold text-slate-600">${i+1}</div>`;
        }
      }
      document.getElementById('spec-host-bans').innerHTML = hostBansHTML;

      let guestBansHTML = '';
      for (let i = 0; i < 4; i++) {
        const b = guestBans[i];
        if (b) {
          guestBansHTML += `<div class="w-16 h-16 bg-slate-800 rounded-lg border border-rose-400 overflow-hidden relative"><img src="${b.image || ''}" class="w-full h-full object-cover grayscale opacity-75"></div>`;
        } else {
          guestBansHTML += `<div class="w-16 h-16 schale-inner rounded-lg flex items-center justify-center text-xs font-bold text-slate-600">${4-i}</div>`;
        }
      }
      document.getElementById('spec-guest-bans').innerHTML = guestBansHTML;

      // Render 3 Games
      const games = data.gameData || [];
      for (let g = 1; g <= 3; g++) {
        const game = games[g - 1] || {};
        
        // Boss
        const bossContainer = document.getElementById(`spec-g${g}-boss`);
        if (game.boss) {
          bossContainer.innerHTML = `<img src="${game.boss.image}" class="w-full h-14 object-cover rounded mb-1"><span class="text-xs font-bold text-sky-400 truncate">${game.boss.name}</span>`;
        } else {
          bossContainer.innerHTML = `<span class="text-xs text-slate-500 font-bold">${g === 3 ? 'Last Remaining' : 'Pending'}</span>`;
        }

        // Terrain
        const terrainContainer = document.getElementById(`spec-g${g}-terrain`);
        if (game.terrain) {
          terrainContainer.innerHTML = `<img src="${game.terrain.image}" class="w-7 h-7 object-contain filter brightness-0 invert mb-1"><span class="text-[10px] font-bold text-amber-300">${game.terrain.name}</span>`;
        } else {
          terrainContainer.innerHTML = `<span class="text-[10px] text-slate-500 font-bold">${g === 3 ? 'Admin Roll' : 'Pending'}</span>`;
        }

        // Student Bans
        const studentContainer = document.getElementById(`spec-g${g}-student-bans`);
        const totalSlots = g === 3 ? 4 : 3;
        let studentHTML = '';
        const bans = game.studentBans || [];
        for (let i = 0; i < totalSlots; i++) {
          const sb = bans[i];
          if (sb) {
            studentHTML += `<div class="w-full h-16 schale-inner rounded overflow-hidden relative"><img src="${sb.image}" class="w-full h-full object-cover grayscale opacity-75"><span class="absolute inset-x-0 bottom-0 text-[9px] bg-slate-900/80 text-center text-rose-300 truncate">${sb.name}</span></div>`;
          } else {
            studentHTML += `<div class="w-full h-16 schale-inner rounded flex items-center justify-center text-xs text-slate-600 font-bold">${i+1}</div>`;
          }
        }
        studentContainer.innerHTML = studentHTML;
      }
    }

    window.onload = syncRoom;
  </script>
</body>
</html>
