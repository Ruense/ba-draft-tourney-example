<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="sh_logo_norm_white.png">
  <title>BO3 Draft Spectator Overlay - Senseihood</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;900&display=swap');
    * { font-family: 'Noto Sans', sans-serif !important; }
    
    body { 
      background-color: #edf5fa; 
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(18, 180, 255, 0.12) 0%, transparent 70%),
        linear-gradient(135deg, rgba(18, 180, 255, 0.04) 25%, transparent 25%),
        linear-gradient(225deg, rgba(18, 180, 255, 0.04) 25%, transparent 25%);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      color: #1e293b; 
    }

    .schale-card {
      background: #ffffff;
      border: 1px solid #cce7ff;
      box-shadow: 0 4px 16px rgba(18, 180, 255, 0.08);
    }

    .schale-card-inner {
      background: #f0f7ff;
      border: 1px solid #d3e6f9;
      color: #334155;
    }
  </style>
</head>
<body class="p-4 flex flex-col justify-start gap-3">

  <!-- SPECTATOR TOP HEADER BAR -->
  <header class="bg-white/90 border border-sky-200 rounded-2xl p-3 flex justify-between items-center shadow-sm backdrop-blur-md">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-sky-500 border border-sky-400 flex items-center justify-center shadow-md overflow-hidden p-1">
        <img src="sh_logo_norm_white.png" alt="Senseihood Emblem" class="w-full h-full object-contain">
      </div>
      <div>
        <h1 class="text-base font-black text-slate-800 tracking-widest uppercase flex items-center gap-2">
          SENSEIHOOD <span class="text-sky-500">BO3 SPECTATOR VIEW</span>
        </h1>
        <p class="text-[10px] text-sky-600 font-bold tracking-wider" id="match-pair-title">WAITING FOR ROOM SYNC...</p>
      </div>
    </div>

    <!-- ROOM CODE INPUT -->
    <div class="flex items-center bg-sky-50/80 px-2.5 py-1 rounded-lg border border-sky-200 text-xs gap-1.5 shadow-inner">
      <span class="text-sky-700 font-bold uppercase tracking-wider text-[10px]">ROOM:</span>
      <input type="text" id="room-input" value="default-room" class="bg-white px-2 py-0.5 rounded text-sky-800 font-black border border-sky-300 w-28 text-center outline-none focus:border-sky-500 shadow-sm text-xs">
      <button onclick="syncRoom()" class="bg-sky-500 hover:bg-sky-400 text-white font-black px-3 py-0.5 rounded transition tracking-wider shadow text-xs">SYNC</button>
    </div>
  </header>

  <!-- TOP BANS SUMMARY -->
  <div class="schale-card rounded-2xl p-3 flex flex-col md:flex-row items-center justify-between gap-4 shadow-md">
    <!-- HOST BANS -->
    <div class="flex flex-col items-center md:items-start gap-1">
      <div class="flex items-center gap-2">
        <span class="text-xs font-black text-sky-600 uppercase tracking-widest" id="spec-host-header">Host Boss Bans</span>
      </div>
      <div id="spec-host-bans" class="flex gap-1.5"></div>
    </div>

    <!-- CENTER LABEL -->
    <div class="text-center px-4">
      <div class="w-8 h-8 mx-auto mb-1 rounded-full bg-sky-50 border border-sky-200 flex items-center justify-center">
        <svg class="w-4 h-4 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/>
        </svg>
      </div>
      <h2 class="text-[11px] font-black text-slate-800 tracking-widest uppercase">BOSS BAN POOL</h2>
      <p class="text-[9px] text-sky-600 font-bold">4 HOST • 4 GUEST</p>
    </div>

    <!-- GUEST BANS -->
    <div class="flex flex-col items-center md:items-end gap-1">
      <div class="flex items-center gap-2">
        <span class="text-xs font-black text-rose-600 uppercase tracking-widest" id="spec-guest-header">Guest Boss Bans</span>
      </div>
      <div id="spec-guest-bans" class="flex gap-1.5"></div>
    </div>
  </div>

  <!-- 3 GAME CARDS DISPLAY (TIGHTENED VERTICAL GAP) -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
    <!-- G1 -->
    <div class="schale-card rounded-2xl p-3 flex flex-col justify-between">
      <div>
        <div class="flex justify-between items-center mb-2 pb-1 border-b border-sky-100">
          <span class="font-black text-xs text-sky-600 tracking-wider" id="spec-g1-title">GAME 1 (HOST PICK)</span>
          <span class="text-[9px] bg-sky-50 border border-sky-200 px-1.5 py-0.5 rounded text-sky-700 font-bold">MATCH 1</span>
        </div>

        <div class="grid grid-cols-3 gap-1.5 mb-3">
          <div id="spec-g1-boss" class="col-span-2 schale-card-inner rounded-xl p-1.5 text-center h-[72px] flex flex-col items-center justify-center"></div>
          <div id="spec-g1-terrain" class="col-span-1 schale-card-inner rounded-xl p-1.5 text-center h-[72px] flex flex-col items-center justify-center"></div>
        </div>
      </div>

      <div>
        <div class="text-[9px] uppercase font-bold text-slate-500 tracking-wider mb-1" id="spec-g1-bans-label">Guest Student Bans (3):</div>
        <div id="spec-g1-student-bans" class="grid grid-cols-3 gap-1"></div>
      </div>
    </div>

    <!-- G2 -->
    <div class="schale-card rounded-2xl p-3 flex flex-col justify-between">
      <div>
        <div class="flex justify-between items-center mb-2 pb-1 border-b border-rose-100">
          <span class="font-black text-xs text-rose-600 tracking-wider" id="spec-g2-title">GAME 2 (GUEST PICK)</span>
          <span class="text-[9px] bg-rose-50 border border-rose-200 px-1.5 py-0.5 rounded text-rose-700 font-bold">MATCH 2</span>
        </div>

        <div class="grid grid-cols-3 gap-1.5 mb-3">
          <div id="spec-g2-boss" class="col-span-2 schale-card-inner rounded-xl p-1.5 text-center h-[72px] flex flex-col items-center justify-center"></div>
          <div id="spec-g2-terrain" class="col-span-1 schale-card-inner rounded-xl p-1.5 text-center h-[72px] flex flex-col items-center justify-center"></div>
        </div>
      </div>

      <div>
        <div class="text-[9px] uppercase font-bold text-slate-500 tracking-wider mb-1" id="spec-g2-bans-label">Host Student Bans (3):</div>
        <div id="spec-g2-student-bans" class="grid grid-cols-3 gap-1"></div>
      </div>
    </div>

    <!-- G3 DECIDER -->
    <div class="schale-card rounded-2xl p-3 flex flex-col justify-between">
      <div>
        <div class="flex justify-between items-center mb-2 pb-1 border-b border-amber-100">
          <span class="font-black text-xs text-amber-600 tracking-wider">GAME 3 (DECIDER)</span>
          <span class="text-[9px] bg-amber-50 border border-amber-200 px-1.5 py-0.5 rounded text-amber-700 font-bold">MATCH 3</span>
        </div>

        <div class="grid grid-cols-3 gap-1.5 mb-3">
          <div id="spec-g3-boss" class="col-span-2 schale-card-inner rounded-xl p-1.5 text-center h-[72px] flex flex-col items-center justify-center"></div>
          <div id="spec-g3-terrain" class="col-span-1 schale-card-inner rounded-xl p-1.5 text-center h-[72px] flex flex-col items-center justify-center"></div>
        </div>
      </div>

      <div>
        <div class="text-[9px] uppercase font-bold text-slate-500 tracking-wider mb-1" id="spec-g3-bans-label">Host (2) & Guest (2) Bans (4):</div>
        <div id="spec-g3-student-bans" class="grid grid-cols-4 gap-1"></div>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCCThwp_3-lx7C6MyCWiUiZich_guk4oLk",
      authDomain: "bluearchivedrafttourney.firebaseapp.com",
      databaseURL: "https://bluearchivedrafttourney-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "bluearchivedrafttourney",
      storageBucket: "bluearchivedrafttourney.firebasestorage.app",
      messagingSenderId: "615654907851",
      appId: "1:1:615654907851:web:f2d3b7101e07149faae04e"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let currentRoomRef = null;

    function syncRoom() {
      const code = document.getElementById('room-input').value.trim() || 'default-room';
      if (currentRoomRef) currentRoomRef.off();

      currentRoomRef = db.ref('draft_rooms/' + code);
      currentRoomRef.on('value', snapshot => {
        const data = snapshot.val();
        if (data) renderSpectator(data);
      });
    }

    function renderSpectator(data) {
      const hostName = data.hostName || 'Host';
      const guestName = data.guestName || 'Guest';

      document.getElementById('match-pair-title').innerText = `${hostName.toUpperCase()} VS ${guestName.toUpperCase()}`;
      document.getElementById('spec-host-header').innerText = `${hostName} Boss Bans`;
      document.getElementById('spec-guest-header').innerText = `${guestName} Boss Bans`;

      document.getElementById('spec-g1-title').innerText = `GAME 1 (${hostName.toUpperCase()} PICK)`;
      document.getElementById('spec-g2-title').innerText = `GAME 2 (${guestName.toUpperCase()} PICK)`;
      
      document.getElementById('spec-g1-bans-label').innerText = `${guestName} Student Bans (3):`;
      document.getElementById('spec-g2-bans-label').innerText = `${hostName} Student Bans (3):`;
      document.getElementById('spec-g3-bans-label').innerText = `${hostName} (2) & ${guestName} (2) Bans (4):`;

      // Render Top Boss Bans
      const bannedBosses = data.bannedBosses || [];
      const hostBans = bannedBosses.filter(b => b.team === 'blue');
      const guestBans = bannedBosses.filter(b => b.team === 'red');

      let hostBansHTML = '';
      for (let i = 0; i < 4; i++) {
        const b = hostBans[i];
        if (b) {
          hostBansHTML += `
            <div class="relative w-14 h-14 schale-card-inner border border-sky-400 rounded-xl overflow-hidden shadow-md flex flex-col justify-between">
              <img src="${b.image || ''}" class="w-full h-full object-cover grayscale opacity-75">
              <div class="absolute inset-x-0 bottom-0 bg-slate-900/80 p-0.5 text-center z-10">
                <span class="text-[8px] font-black text-sky-200 truncate block">${b.name || ''}</span>
              </div>
            </div>
          `;
        } else {
          hostBansHTML += `
            <div class="w-14 h-14 schale-card-inner border border-sky-200 rounded-xl flex items-center justify-center text-sky-600 font-black text-xs">
              ${i + 1}
            </div>
          `;
        }
      }
      document.getElementById('spec-host-bans').innerHTML = hostBansHTML;

      let guestBansHTML = '';
      const guestLabels = [4, 3, 2, 1];
      for (let i = 0; i < 4; i++) {
        const b = guestBans[i];
        if (b) {
          guestBansHTML += `
            <div class="relative w-14 h-14 schale-card-inner border border-rose-400 rounded-xl overflow-hidden shadow-md flex flex-col justify-between">
              <img src="${b.image || ''}" class="w-full h-full object-cover grayscale opacity-75">
              <div class="absolute inset-x-0 bottom-0 bg-slate-900/80 p-0.5 text-center z-10">
                <span class="text-[8px] font-black text-rose-200 truncate block">${b.name || ''}</span>
              </div>
            </div>
          `;
        } else {
          guestBansHTML += `
            <div class="w-14 h-14 schale-card-inner border border-rose-200 rounded-xl flex items-center justify-center text-rose-600 font-black text-xs">
              ${guestLabels[i]}
            </div>
          `;
        }
      }
      document.getElementById('spec-guest-bans').innerHTML = guestBansHTML;

      // Render 3 Games
      const games = data.gameData || [];
      for (let g = 1; g <= 3; g++) {
        const game = games[g - 1] || {};
        
        // Boss Slot
        const bossContainer = document.getElementById(`spec-g${g}-boss`);
        if (game.boss) {
          bossContainer.innerHTML = `
            <img src="${game.boss.image}" class="w-full h-11 object-cover rounded mb-0.5">
            <span class="text-[10px] font-bold text-sky-700 truncate w-full text-center">${game.boss.name}</span>
          `;
        } else {
          bossContainer.innerHTML = `
            <span class="text-[8px] text-sky-600 uppercase font-black">Boss</span>
            <span class="text-[10px] font-bold text-slate-500">${g === 3 ? 'Last Remaining' : 'Pending'}</span>
          `;
        }

        // Terrain Slot
        const terrainContainer = document.getElementById(`spec-g${g}-terrain`);
        if (game.terrain) {
          terrainContainer.className = "col-span-1 border border-amber-400 rounded-xl p-1.5 text-center h-[72px] flex flex-col items-center justify-center relative bg-slate-900";
          terrainContainer.innerHTML = `
            <img src="${game.terrain.image}" class="w-6 h-6 object-contain rounded mb-0.5 filter brightness-0 invert">
            <span class="text-[8px] font-black text-amber-300 truncate w-full text-center">${game.terrain.name}</span>
          `;
        } else {
          terrainContainer.className = "col-span-1 schale-card-inner border border-sky-200 rounded-xl p-1.5 text-center h-[72px] flex flex-col items-center justify-center relative";
          terrainContainer.innerHTML = `
            <span class="text-[8px] text-sky-600 uppercase font-black">Terrain</span>
            <span class="text-[10px] font-bold ${g === 3 ? 'text-amber-600' : 'text-slate-500'}">${g === 3 ? 'Admin Roll' : 'Pending'}</span>
          `;
        }

        // Student Bans
        const studentContainer = document.getElementById(`spec-g${g}-student-bans`);
        const totalSlots = g === 3 ? 4 : 3;
        let studentHTML = '';
        const bans = game.studentBans || [];
        for (let i = 0; i < totalSlots; i++) {
          const sb = bans[i];
          if (sb) {
            studentHTML += `
              <div class="relative w-full h-12 schale-card-inner border border-rose-300 rounded-lg overflow-hidden shadow-sm">
                <img src="${sb.image}" class="w-full h-full object-cover grayscale opacity-75">
                <div class="absolute inset-x-0 bottom-0 bg-slate-900/80 p-0.5 text-center z-10">
                  <span class="text-[8px] font-black text-rose-200 truncate block">${sb.name}</span>
                </div>
              </div>
            `;
          } else {
            studentHTML += `
              <div class="w-full h-12 schale-card-inner border border-slate-200 rounded-lg flex items-center justify-center text-slate-400">
                <span class="text-[8px] font-bold text-slate-400">BAN ${i + 1}</span>
              </div>
            `;
          }
        }
        studentContainer.innerHTML = studentHTML;
      }
    }

    window.onload = syncRoom;
  </script>
</body>
</html>
